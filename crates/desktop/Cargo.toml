[package]
name = "messages"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[dependencies]
messages-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
schemars = "1.2.3"
toml_edit = "0.25"
base64 = "0.22"
nd = { path = "../../../nativedesktop-wt-msg-gaps/crates/nd", features = ["settings-ui"] }
nd-settings = { path = "../../../nativedesktop-wt-msg-gaps/crates/nd-settings" }
nd-ipc = { path = "../../../nativedesktop-wt-msg-gaps/crates/nd-ipc" }

[dev-dependencies]
nd = { path = "../../../nativedesktop-wt-msg-gaps/crates/nd", features = ["test", "audit"] }
nd-test = { path = "../../../nativedesktop-wt-msg-gaps/crates/nd-test" }
ndshell = { path = "../../../nativedesktop-wt-msg-gaps/crates/ndshell" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
ndshell = { path = "../../../nativedesktop-wt-msg-gaps/crates/ndshell" }

[build-dependencies]
nd = { path = "../../../nativedesktop-wt-msg-gaps/crates/nd", default-features = false, features = ["build"] }

# The appearance audit owns the main thread (AppKit), so libtest's harness is off.
[[test]]
name = "appearance"
harness = false
