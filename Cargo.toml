[workspace]
resolver = "3"
members = ["crates/core", "crates/desktop"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
messages-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tracing = "0.1"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# NativeDesktop is a path dependency of crates/desktop until it is published: the checkout of
# its `msg-gaps` branch beside this repo (nd main plus the gaps this port found). Switch these
# and crates/desktop/Cargo.toml to `git = "https://github.com/FormalSnake/NativeDesktop"` (one
# rev for all) once that branch is merged. nd carries its own patched GPUI, which only
# reaches this workspace through the patch table below.
[patch.crates-io]
gpui-pre = { path = "../nativedesktop-wt-msg-linux-2/crates/nd-gpui/vendor/gpui-pre" }
gpui-fast = { path = "../nativedesktop-wt-msg-linux-2/crates/nd-gpui/vendor/gpui-fast" }
gpui-pre-linux = { path = "../nativedesktop-wt-msg-linux-2/crates/nd-gpui/vendor/gpui-pre-linux" }
gpui-fast-linux = { path = "../nativedesktop-wt-msg-linux-2/crates/nd-gpui/vendor/gpui-fast-linux" }
gpui-pre-wgpu = { path = "../nativedesktop-wt-msg-linux-2/crates/nd-gpui/vendor/gpui-pre-wgpu" }
gpui-fast-wgpu = { path = "../nativedesktop-wt-msg-linux-2/crates/nd-gpui/vendor/gpui-fast-wgpu" }
gpui-pre-windows = { path = "../nativedesktop-wt-msg-linux-2/crates/nd-gpui/vendor/gpui-pre-windows" }
gpui-fast-windows = { path = "../nativedesktop-wt-msg-linux-2/crates/nd-gpui/vendor/gpui-fast-windows" }
gpui-pre-apple = { path = "../nativedesktop-wt-msg-linux-2/crates/nd-gpui/vendor/gpui-pre-apple" }
gpui-fast-apple = { path = "../nativedesktop-wt-msg-linux-2/crates/nd-gpui/vendor/gpui-fast-apple" }
