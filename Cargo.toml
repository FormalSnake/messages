[workspace]
resolver = "3"
members = ["crates/core", "crates/desktop"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
messages-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tracing = "0.1"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# NativeDesktop from its main branch, one rev for all in Cargo.lock. nd carries its own patched
# GPUI, which only reaches this workspace through the patch table below.
[patch.crates-io]
gpui-pre = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-pre-linux = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast-linux = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-pre-wgpu = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast-wgpu = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-pre-windows = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast-windows = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-pre-apple = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast-apple = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
